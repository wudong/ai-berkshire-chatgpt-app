name: Roll back AI Berkshire MCP

on:
  workflow_dispatch:

concurrency:
  group: ai-berkshire-mcp-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: wudong-agent-master
  GCP_WIF_PROVIDER: projects/126174378735/locations/global/workloadIdentityPools/ai-berkshire-actions/providers/rollback
  GCP_SERVICE_ACCOUNT: ai-berkshire-rollback-reader@wudong-agent-master.iam.gserviceaccount.com
  GCP_PARAMETER: ai-berkshire-rollback-prod

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Render and validate rollback configuration
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-rollback-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          umask 077
          gcloud parametermanager parameters versions render latest \
            --parameter="$GCP_PARAMETER" \
            --location=global \
            --project="$GCP_PROJECT_ID" \
            --format='value(renderedPayload)' \
            | base64 -d > "$CONFIG_FILE"
          chmod 600 "$CONFIG_FILE"
          jq -e '
            .schema_version == 1 and
            (.vps.host | type == "string" and length > 0) and
            (.vps.user | type == "string" and length > 0) and
            (.vps.host_key | type == "string" and startswith("ssh-")) and
            (.mcp.hostname | type == "string" and length > 0) and
            (.secrets.vps_ssh_key | type == "string" and length > 0)
          ' "$CONFIG_FILE" >/dev/null

      - name: Configure deployment SSH
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-rollback-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -r '.vps.host' "$CONFIG_FILE")"
          VPS_HOST_KEY="$(jq -r '.vps.host_key' "$CONFIG_FILE")"
          VPS_SSH_KEY="$(jq -r '.secrets.vps_ssh_key' "$CONFIG_FILE")"
          test -n "$VPS_HOST"
          test -n "$VPS_HOST_KEY"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Roll back current release
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-rollback-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -r '.vps.host' "$CONFIG_FILE")"
          VPS_USER="$(jq -r '.vps.user' "$CONFIG_FILE")"
          test -n "$VPS_USER"
          ssh "$VPS_USER@$VPS_HOST" \
            'bash /opt/ai-berkshire-mcp/current/deploy/scripts/rollback-vps-release.sh'

      - name: Verify production health
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-rollback-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          MCP_HOSTNAME="$(jq -r '.mcp.hostname' "$CONFIG_FILE")"
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "https://$MCP_HOSTNAME/healthz"

      - name: Clean temporary credentials
        if: always()
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-rollback-${{ github.run_id }}.json
        run: |
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts "$CONFIG_FILE"
          find "${RUNNER_TEMP:-/tmp}" -maxdepth 1 -type f -name 'gha-creds-*.json' -delete 2>/dev/null || true
