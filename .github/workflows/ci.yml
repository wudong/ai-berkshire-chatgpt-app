name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Quality gate
        run: bun run check
      - name: Validate deployment scripts
        run: bash -n deploy/scripts/*.sh
      - name: Validate GCP configuration contract
        run: |
          set -euo pipefail
          grep -q 'GCP_PROJECT_ID: wudong-agent-master' .github/workflows/deploy.yml
          grep -q 'GCP_WIF_PROVIDER: projects/126174378735/locations/global/workloadIdentityPools/ai-berkshire-actions/providers/deploy' .github/workflows/deploy.yml
          grep -q 'GCP_SERVICE_ACCOUNT: ai-berkshire-deploy-reader@wudong-agent-master.iam.gserviceaccount.com' .github/workflows/deploy.yml
          grep -q 'GCP_PARAMETER: ai-berkshire-deploy-prod' .github/workflows/deploy.yml
          grep -q 'GCP_PROJECT_ID: wudong-agent-master' .github/workflows/rollback.yml
          grep -q 'GCP_WIF_PROVIDER: projects/126174378735/locations/global/workloadIdentityPools/ai-berkshire-actions/providers/rollback' .github/workflows/rollback.yml
          grep -q 'GCP_SERVICE_ACCOUNT: ai-berkshire-rollback-reader@wudong-agent-master.iam.gserviceaccount.com' .github/workflows/rollback.yml
          grep -q 'GCP_PARAMETER: ai-berkshire-rollback-prod' .github/workflows/rollback.yml
          grep -q 'parametermanager parameters versions render latest' .github/workflows/deploy.yml
          grep -q 'parametermanager parameters versions render latest' .github/workflows/rollback.yml
          grep -Fq "if: steps.mode.outputs.mode == 'canary' || steps.mode.outputs.mode == 'deploy'" .github/workflows/deploy.yml
          preflight_line="$(grep -n 'name: WIF and VPS preflight canary' .github/workflows/deploy.yml | cut -d: -f1)"
          upload_line="$(grep -n 'name: Upload versioned release' .github/workflows/deploy.yml | cut -d: -f1)"
          [[ -n "$preflight_line" && -n "$upload_line" && "$preflight_line" -lt "$upload_line" ]]
          if grep -n -E '\$\{\{[[:space:]]*(vars|secrets)\.AI_BERKSHIRE_' .github/workflows/deploy.yml .github/workflows/rollback.yml; then
            echo 'AI Berkshire workflows must not read deployment configuration from GitHub Variables/Secrets.' >&2
            exit 1
          fi
          if grep -n -E 'ssh-keyscan|StrictHostKeyChecking=no|UserKnownHostsFile=/dev/null' .github/workflows/deploy.yml .github/workflows/rollback.yml; then
            echo 'AI Berkshire workflows must retain pinned/managed host verification.' >&2
            exit 1
          fi
