name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: |
          if [[ -f bun.lock ]]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - name: Commit generated Bun lockfile once
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('bun.lock') != '' }}
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'chore: add Bun lockfile'
          git push origin HEAD:main
      - name: Quality gate
        run: bun run check
      - name: Validate deployment scripts
        run: bash -n deploy/scripts/*.sh
