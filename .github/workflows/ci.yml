name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install
      - name: Capture Bun lockfile for bootstrap
        if: ${{ hashFiles('bun.lock') != '' }}
        run: echo "BUN_LOCK_BASE64=$(base64 -w 0 bun.lock)"
      - name: Quality gate
        run: bun run check
      - name: Validate deployment scripts
        run: bash -n deploy/scripts/*.sh
