name: Deploy AI Berkshire MCP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Run a non-mutating credential/SSH canary or perform a deployment
        required: true
        default: canary
        type: choice
        options:
          - canary
          - deploy

concurrency:
  group: ai-berkshire-mcp-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: wudong-agent-master
  GCP_WIF_PROVIDER: projects/126174378735/locations/global/workloadIdentityPools/ai-berkshire-actions/providers/deploy
  GCP_SERVICE_ACCOUNT: ai-berkshire-deploy-reader@wudong-agent-master.iam.gserviceaccount.com
  GCP_PARAMETER: ai-berkshire-deploy-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mode=deploy
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            mode=${REQUESTED_MODE:-canary}
          fi
          [[ "$mode" == canary || "$mode" == deploy ]]
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality gate and build
        run: bun run check

      - name: Validate deployment scripts
        run: bash -n deploy/scripts/*.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Render and validate deployment configuration
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-config-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          umask 077
          gcloud parametermanager parameters versions render latest \
            --parameter="$GCP_PARAMETER" \
            --location=global \
            --project="$GCP_PROJECT_ID" \
            --format='value(renderedPayload)' \
            | base64 -d > "$CONFIG_FILE"
          chmod 600 "$CONFIG_FILE"
          jq -e '
            .schema_version == 2 and
            (.vps.host | type == "string" and length > 0) and
            (.vps.user | type == "string" and length > 0) and
            (.vps.host_key | type == "string" and startswith("ssh-")) and
            (.mcp.hostname | type == "string" and length > 0) and
            (.mcp.port == 3020) and
            (.mcp.origin == "http://127.0.0.1:3020") and
            (.cloudflare.zone_id | type == "string" and length > 0) and
            (.cloudflare.tunnel_id | type == "string" and length > 0) and
            (.google.allowed_sub | type == "string") and
            (.secrets.vps_ssh_key_secret_id == "tt-players-hetzner-vps-deploy-key") and
            (.secrets.cloudflare_account_id | type == "string" and length > 0) and
            (.secrets.cloudflare_api_token | type == "string" and length > 0) and
            (.secrets.google_client_id | type == "string" and length > 0) and
            (.secrets.google_client_secret | type == "string" and length > 0) and
            (.secrets.allowed_google_email | type == "string" and length > 0)
          ' "$CONFIG_FILE" >/dev/null

      - name: Configure deployment SSH
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-config-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -r '.vps.host' "$CONFIG_FILE")"
          VPS_HOST_KEY="$(jq -r '.vps.host_key' "$CONFIG_FILE")"
          VPS_SSH_KEY_SECRET_ID="$(jq -r '.secrets.vps_ssh_key_secret_id' "$CONFIG_FILE")"
          test -n "$VPS_HOST"
          test -n "$VPS_HOST_KEY"
          test "$VPS_SSH_KEY_SECRET_ID" = "tt-players-hetzner-vps-deploy-key"
          install -m 700 -d ~/.ssh
          gcloud secrets versions access latest \
            --secret="$VPS_SSH_KEY_SECRET_ID" \
            --project="$GCP_PROJECT_ID" > ~/.ssh/id_ed25519
          test -s ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: WIF and VPS preflight canary
        if: steps.mode.outputs.mode == 'canary' || steps.mode.outputs.mode == 'deploy'
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-config-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -r '.vps.host' "$CONFIG_FILE")"
          VPS_USER="$(jq -r '.vps.user' "$CONFIG_FILE")"
          ssh "$VPS_USER@$VPS_HOST" 'test "$(id -u)" = 0 && systemctl is-active cloudflared postgresql >/dev/null'
          {
            echo '### AI Berkshire delivery canary'
            echo '- GitHub OIDC → GCP WIF: **passed**'
            echo '- Parameter Manager render/schema validation: **passed**'
            echo '- One-line Secret Manager references resolved by Parameter Manager: **passed**'
            echo '- VPS SSH key read through secret-scoped Secret Manager access: **passed**'
            echo '- Pinned-host-key VPS SSH: **passed**'
            echo '- VPS cloudflared/postgresql health: **passed**'
            echo '- Production mutation before this gate: **none**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload versioned release
        if: steps.mode.outputs.mode == 'deploy'
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-config-${{ github.run_id }}.json
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -r '.vps.host' "$CONFIG_FILE")"
          VPS_USER="$(jq -r '.vps.user' "$CONFIG_FILE")"
          ssh "$VPS_USER@$VPS_HOST" \
            "test \"\$(id -u)\" = 0 && mkdir -p /opt/ai-berkshire-mcp/releases/$RELEASE_SHA"
          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude .env \
            ./ "$VPS_USER@$VPS_HOST:/opt/ai-berkshire-mcp/releases/$RELEASE_SHA/"

      - name: Configure VPS runtime
        if: steps.mode.outputs.mode == 'deploy'
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-config-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          umask 077
          VPS_HOST="$(jq -r '.vps.host' "$CONFIG_FILE")"
          VPS_USER="$(jq -r '.vps.user' "$CONFIG_FILE")"
          RELEASE_SHA="${{ github.sha }}"
          google_client_id="$(jq -r '.secrets.google_client_id' "$CONFIG_FILE")"
          google_client_secret="$(jq -r '.secrets.google_client_secret' "$CONFIG_FILE")"
          allowed_google_email="$(jq -r '.secrets.allowed_google_email' "$CONFIG_FILE")"
          allowed_google_sub="$(jq -r '.google.allowed_sub' "$CONFIG_FILE")"
          mcp_hostname="$(jq -r '.mcp.hostname' "$CONFIG_FILE")"
          local_patch="$(mktemp)"
          remote_patch="/tmp/ai-berkshire-runtime-${GITHUB_RUN_ID}"
          trap 'rm -f "$local_patch"' EXIT
          encode() { printf '%s' "$1" | base64 -w 0; }
          {
            printf 'GOOGLE_CLIENT_ID_B64=%s\n' "$(encode "$google_client_id")"
            printf 'GOOGLE_CLIENT_SECRET_B64=%s\n' "$(encode "$google_client_secret")"
            printf 'ALLOWED_GOOGLE_EMAIL_B64=%s\n' "$(encode "$allowed_google_email")"
            printf 'ALLOWED_GOOGLE_SUB_B64=%s\n' "$(encode "$allowed_google_sub")"
            printf 'MCP_HOSTNAME_B64=%s\n' "$(encode "$mcp_hostname")"
          } > "$local_patch"
          scp "$local_patch" "$VPS_USER@$VPS_HOST:$remote_patch"
          ssh "$VPS_USER@$VPS_HOST" \
            "bash /opt/ai-berkshire-mcp/releases/$RELEASE_SHA/deploy/scripts/write-vps-config.sh \
             /opt/ai-berkshire-mcp/releases/$RELEASE_SHA '$remote_patch'"

      - name: Activate release
        if: steps.mode.outputs.mode == 'deploy'
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-config-${{ github.run_id }}.json
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -r '.vps.host' "$CONFIG_FILE")"
          VPS_USER="$(jq -r '.vps.user' "$CONFIG_FILE")"
          ssh "$VPS_USER@$VPS_HOST" \
            "bash /opt/ai-berkshire-mcp/releases/$RELEASE_SHA/deploy/scripts/deploy-vps-release.sh \
             /opt/ai-berkshire-mcp/releases/$RELEASE_SHA '$RELEASE_SHA'"

      - name: Configure Cloudflare tunnel and DNS
        if: steps.mode.outputs.mode == 'deploy'
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-config-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(jq -r '.secrets.cloudflare_api_token' "$CONFIG_FILE")"
          CLOUDFLARE_ACCOUNT_ID="$(jq -r '.secrets.cloudflare_account_id' "$CONFIG_FILE")"
          CLOUDFLARE_ZONE_ID="$(jq -r '.cloudflare.zone_id' "$CONFIG_FILE")"
          CLOUDFLARE_TUNNEL_ID="$(jq -r '.cloudflare.tunnel_id' "$CONFIG_FILE")"
          MCP_HOSTNAME="$(jq -r '.mcp.hostname' "$CONFIG_FILE")"
          MCP_ORIGIN_SERVICE="$(jq -r '.mcp.origin' "$CONFIG_FILE")"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID CLOUDFLARE_TUNNEL_ID MCP_HOSTNAME MCP_ORIGIN_SERVICE
          deploy/scripts/configure-cloudflare-route.sh

      - name: Verify production health
        if: steps.mode.outputs.mode == 'deploy'
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-config-${{ github.run_id }}.json
        run: |
          set -euo pipefail
          MCP_HOSTNAME="$(jq -r '.mcp.hostname' "$CONFIG_FILE")"
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "https://$MCP_HOSTNAME/healthz"

      - name: Deployment summary
        if: steps.mode.outputs.mode == 'deploy'
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-config-${{ github.run_id }}.json
        run: |
          MCP_HOSTNAME="$(jq -r '.mcp.hostname' "$CONFIG_FILE")"
          {
            echo '### AI Berkshire MCP'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo '- Runtime: Bun'
            echo '- Service: `ai-berkshire-mcp.service`'
            echo "- Endpoint: \`https://$MCP_HOSTNAME/mcp\`"
            echo '- Local origin: `http://127.0.0.1:3020`'
            echo '- Auth: Better Auth MCP OAuth + Google provider'
            echo '- Config: Parameter Manager `ai-berkshire-deploy-prod` schema v2'
            echo '- Secrets: one-line values rendered by Parameter Manager; VPS SSH key read directly from its secret-scoped Secret Manager grant'
            echo '- CI credentials: GitHub OIDC → GCP WIF'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean temporary credentials
        if: always()
        env:
          CONFIG_FILE: ${{ runner.temp }}/ai-berkshire-config-${{ github.run_id }}.json
          REMOTE_PATCH: /tmp/ai-berkshire-runtime-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -f "$CONFIG_FILE" && -f ~/.ssh/id_ed25519 ]]; then
            VPS_HOST="$(jq -r '.vps.host' "$CONFIG_FILE" 2>/dev/null || true)"
            VPS_USER="$(jq -r '.vps.user' "$CONFIG_FILE" 2>/dev/null || true)"
            if [[ -n "$VPS_HOST" && -n "$VPS_USER" ]]; then
              ssh "$VPS_USER@$VPS_HOST" "rm -f '$REMOTE_PATCH'" || true
            fi
          fi
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts "$CONFIG_FILE"
          find "${RUNNER_TEMP:-/tmp}" -maxdepth 1 -type f -name 'gha-creds-*.json' -delete 2>/dev/null || true
